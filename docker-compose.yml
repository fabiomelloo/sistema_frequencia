services:
  app:
    build: .
    image: sistema_frequencia_app
    container_name: sistema_frequencia_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=frequencia
      - DB_USERNAME=frequencia
      - DB_PASSWORD=${DB_PASSWORD:-frequencia}
    depends_on:
      - db

  web:
    image: nginx:1.23-alpine
    container_name: sistema_frequencia_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    container_name: sistema_frequencia_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: frequencia
      MYSQL_USER: frequencia
      MYSQL_PASSWORD: ${DB_PASSWORD:-frequencia}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  db-data:
    driver: local

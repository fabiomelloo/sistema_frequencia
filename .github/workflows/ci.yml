name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: PHP 8.3 / MySQL 8.4
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sistema_frequencia_test
          MYSQL_ROOT_PASSWORD: frequencia_local
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pfrequencia_local --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, mbstring, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate PHP syntax
        run: find app database/migrations tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run test suite
        run: php artisan test

  deploy-image:
    name: Build deploy image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build --target app --tag sistema-frequencia:${{ github.sha }} .
